<script>
        // Generate grid items
        const grid = document.getElementById('inventory-grid');
        const icons = ['category', 'layers', 'water_drop', 'restaurant', 'air', 'oil_barrel', 'memory', 'diamond', 'bolt', 'science'];
        const colors = ['text-surface-tint', 'text-tertiary-fixed', 'text-error', 'text-on-surface-variant'];
        
        for (let i = 0; i < 64; i++) {
            const slot = document.createElement('div');
            const isEmpty = Math.random() > 0.7;
            
            slot.className = 'aspect-square border flex items-center justify-center relative cursor-pointer group transition-colors';
            
            if (isEmpty) {
                slot.classList.add('border-outline-variant/30', 'bg-surface-dim');
            } else {
                const icon = icons[Math.floor(Math.random() * icons.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const isSelected = i === 12; // Force one active state
                
                slot.classList.add(
                    isSelected ? 'border-surface-tint' : 'border-outline-variant',
                    isSelected ? 'bg-surface-tint/10' : 'bg-surface-container-high',
                    isSelected ? 'border-glow-active' : 'hover:border-surface-tint/50'
                );
                
                const iconEl = document.createElement('span');
                iconEl.className = `material-symbols-outlined text-[24px] ${color} ${isSelected ? 'animate-pulse' : 'group-hover:scale-110 transition-transform'}`;
                iconEl.style.fontVariationSettings = "'FILL' 1";
                iconEl.textContent = icon;
                slot.appendChild(iconEl);
                
                const stackSize = document.createElement('span');
                stackSize.className = 'absolute bottom-1 right-1 font-data-mono text-[9px] text-on-surface';
                stackSize.textContent = Math.floor(Math.random() * 64) + 1;
                slot.appendChild(stackSize);
            }
            
            grid.appendChild(slot);
        }
    </script>
